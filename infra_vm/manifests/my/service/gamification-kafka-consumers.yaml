apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gamification-kafka-consumers-config
  namespace: ${NAMESPACE}
data:
  ASPNETCORE_ENVIRONMENT: "Test"
  DbOptions__Host: "postgres-postgresql"
  KafkaOptions__BootstrapServers: "kafka.${NAMESPACE}.svc.cluster.local:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: gamification-kafka-consumers-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  DbOptions__Username: "app_user"
  DbOptions__Password: "app_password"
  KafkaOptions__Username: "app_user"
  KafkaOptions__Password: "app_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-kafka-consumers
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamification-kafka-consumers
  template:
    metadata:
      labels:
        app: gamification-kafka-consumers
    spec:
      containers:
        - name: gamification-kafka-consumers
          image: ikeeo/vibecheck-gamification-kafka-consumers:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gamification-kafka-consumers-config
            - secretRef:
                name: gamification-kafka-consumers-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-kafka-consumers
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: gamification-kafka-consumers
  ports:
    - name: http
      port: 8080
      targetPort: http
