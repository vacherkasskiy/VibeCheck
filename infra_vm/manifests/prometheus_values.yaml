alertmanager:
  enabled: false

server:
  enabled: true
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
  persistentVolume:
    enabled: true
    size: 2Gi
  service:
    type: ClusterIP
    servicePort: 9090
  extraFlags:
    - web.enable-lifecycle
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false
